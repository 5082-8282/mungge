<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F2F9FE">
<title>뭉게뭉게</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="뭉게뭉게">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 뭉게뭉게: 아주 연한 하늘색 바탕, 남색 잉크, 하늘색 포인트, 흰 구름 · 레이아웃: 위 시계+구름 저금통, 아래 2열(할 일 | 메일·결재와 마감) */
  --bg:#F2F7FB; --card:#FFFFFF; --ink:#1E2E3D; --muted:#6B7E8F; --line:#E1EAF1; --soft:#EDF4F9;
  --accent:#3D8FD1; --accent-ink:#2A6FA8; --accent-soft:#E1EFFA;
  --cloud:#FFFFFF; --cloud-2:#E6F3FC; --cloud-3:#CFE6F8; --cloud-4:#B9DBF5; --cloud-shade:#8CBDE6; --blush:#F7B9C8;
  --sky-top:#E4F3FD; --sky-bottom:#FBFDFF;
  --alert:#E07A4F; --alert-bg:#FFF3EC;
  --c-sky:#5AAAE6; --c-rose:#3A6796; --c-leaf:#3E9DB0; --c-tang:#7F94DB; --c-lilac:#9DB4CC; --c-sand:#6F8699;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A22; --card:#1A2530; --ink:#E6EEF5; --muted:#93A6B7; --line:#2A3946; --soft:#20303D;
    --accent:#6FB4EC; --accent-ink:#8DC4F0; --accent-soft:#1F3a52;
    --cloud:#E9F2FA; --cloud-2:#CFE1F1; --cloud-3:#B4CFE7; --cloud-4:#9DBFDD; --cloud-shade:#3E5C78; --blush:#E79AAD;
    --sky-top:#1D3A57; --sky-bottom:#121A22;
    --alert:#F09068; --alert-bg:#3A2A22;
    --c-sky:#7CC0F0; --c-rose:#7FA3CC; --c-leaf:#6CC0D0; --c-tang:#A3B4EC; --c-lilac:#B5C8DA; --c-sand:#97ABBC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A22; --card:#1A2530; --ink:#E6EEF5; --muted:#93A6B7; --line:#2A3946; --soft:#20303D;
  --accent:#6FB4EC; --accent-ink:#8DC4F0; --accent-soft:#1F3a52;
  --cloud:#E9F2FA; --cloud-2:#CFE1F1; --cloud-3:#B4CFE7; --cloud-4:#9DBFDD; --cloud-shade:#3E5C78; --blush:#E79AAD;
  --sky-top:#1D3A57; --sky-bottom:#121A22;
  --alert:#F09068; --alert-bg:#3A2A22;
  --c-sky:#7CC0F0; --c-rose:#7FA3CC; --c-leaf:#6CC0D0; --c-tang:#A3B4EC; --c-lilac:#B5C8DA; --c-sand:#97ABBC;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--body);font-weight:700;margin:0;text-wrap:balance}
h2{font-size:16px;letter-spacing:-.01em}
h3{font-size:15px}
.wrap{max-width:1280px;margin:0 auto;padding:16px 16px 64px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-family:var(--display);font-weight:400;font-size:28px;color:var(--accent-ink)}
.brand .date{color:var(--muted);font-size:13.5px;margin-left:4px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.sync.local i{background:#E2AE33}
.sync.wait i{background:var(--muted)}
.sync.err i{background:var(--alert)}
.tabs{margin-left:auto;display:flex;gap:2px;background:color-mix(in srgb,var(--accent) 9%,var(--card));padding:4px;border-radius:12px;overflow-x:auto;max-width:100%}
.tabs a{font-weight:500;font-size:14px;text-decoration:none;color:var(--muted);padding:6px 14px;border-radius:9px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--card);color:var(--accent-ink);box-shadow:0 1px 3px rgba(30,60,90,.12)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-head .count{color:var(--muted);font-size:14px;font-weight:500}
.card-head .right{margin-left:auto}
.sub{color:var(--muted);font-size:13px;margin:2px 0 12px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:24px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;margin-bottom:12px}
.bubble{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:4px 12px 4px 6px;font-size:13px;font-weight:500;margin-bottom:8px;max-width:100%}
.bubble svg{flex:none}
.clock-label{color:var(--muted);font-size:13.5px;font-weight:500}
.clock-big{font-family:var(--display);font-size:48px;line-height:1.05;font-variant-numeric:tabular-nums}
.clock-big small{font-family:var(--body);font-size:17px;color:var(--muted);margin:0 6px 0 3px;font-weight:500}
.track{position:relative;height:8px;background:var(--soft);border-radius:999px;margin:14px 0 26px}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--accent)}
.track .tick{position:absolute;top:1px;width:6px;height:6px;border-radius:50%;background:var(--card);border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateX(-50%)}
.track .tick.ok{background:var(--accent);border-color:var(--accent)}
.track .tick.late{border-color:var(--alert);background:var(--alert)}
.track .tick.close{width:3px;height:14px;top:-3px;border-radius:2px;border:0;background:var(--accent-ink)}
.track .tick span{position:absolute;top:13px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.track .me{position:absolute;top:50%;transform:translate(-50%,-58%)}
.focus-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.focus-line b{font-weight:700;font-size:15px}
.focus-line .lbl{color:var(--muted)}

/* jar */
.jar{display:grid;justify-items:center;gap:4px;text-align:center}
.jar > svg{width:150px;height:auto;overflow:visible}
.jar-num{font-family:var(--display);font-size:26px;line-height:1;color:var(--ink)}
.jar-num small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:2px}
.jar-next{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;line-height:1.35;text-align:left}
.jar-next b{color:var(--accent-ink);font-weight:700}
.jar .drop{animation:drop .7s cubic-bezier(.3,1.4,.6,1)}
@keyframes drop{from{transform:translateY(-110px);opacity:0}30%{opacity:1}to{transform:none}}

/* banners */
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:var(--r);padding:12px 16px;margin-bottom:12px;background:var(--alert-bg);border:1px solid color-mix(in srgb,var(--alert) 25%,transparent);font-size:14px}
.banner .msg{flex:1 1 220px}
.banner .msg b{font-weight:700;font-size:15px;color:var(--alert);display:block}
.banner.calm{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.banner.calm .msg b{color:var(--accent-ink)}
.bell{animation:ring 1.6s ease-in-out infinite;transform-origin:50% 10%;display:inline-flex}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(8deg)}40%{transform:rotate(-5deg)}}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.main:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500}
.pill.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-ink)}

/* arrival */
.arrive{margin-bottom:12px;border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.arrive-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.arrive-list{list-style:none;margin:0;padding:0}
.arrive-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--soft);font-weight:500;font-size:14.5px}
.arrive-item .num{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.edit-list{display:grid;gap:6px}
.edit-list input[type=text],.edit-list input[type=time]{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;min-width:0;width:100%}
.edit-list input:focus{border-color:var(--accent);outline:none}
.edit-list .erow{grid-template-columns:96px 1fr auto auto}
.edit-list .erow.simple{grid-template-columns:1fr auto}
@media (max-width:560px){.edit-list .erow{grid-template-columns:88px 1fr auto}.edit-list .erow .mon-toggle{grid-column:2}}
.arrive-item:hover{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.arrive-item .box{width:20px;height:20px;border-radius:6px;border:2px solid color-mix(in srgb,var(--accent) 55%,var(--line));display:grid;place-items:center;flex:none;background:var(--card)}
.arrive-item.ok{background:var(--accent-soft);color:var(--accent-ink)}
.arrive-item.ok .box{background:var(--accent);border-color:var(--accent)}
.side .arrive{margin-bottom:0}
.side .arrive .arrive-list{grid-template-columns:1fr 1fr}
.side .arrive .arrive-item{padding:8px 10px;font-size:13.5px}

/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:12px;align-items:start}
/* 컴퓨터: 오늘 할 일 | 메모장 나란히, 오른쪽에 메일·마감 */
.pane-wrap{min-width:0}
.pager{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;align-items:stretch}
.pager-tabs{display:none}
.memo{display:flex;flex-direction:column}
.memo textarea{flex:1;min-height:320px;width:100%;resize:vertical;border:0;outline:none;background:
  repeating-linear-gradient(180deg,transparent 0 27px,var(--line) 27px 28px);background-attachment:local;
  line-height:28px;font:inherit;font-size:14.5px;line-height:28px;color:var(--ink);padding:0 2px}
.memo textarea::placeholder{color:var(--muted)}
@media (min-width:1100px){.cols{grid-template-columns:minmax(0,2.5fr) minmax(0,1fr)}}
@media (max-width:1099px) and (min-width:561px){.pager{grid-template-columns:1fr}.memo textarea{min-height:200px}}
/* 폰: 오늘 할 일을 옆으로 넘기면 메모장 */
@media (max-width:560px){
  .pager-tabs{display:flex;gap:4px;margin:0 0 8px;background:color-mix(in srgb,var(--accent) 9%,var(--card));padding:3px;border-radius:11px;width:max-content}
  .pager-tabs button{border:0;background:transparent;border-radius:8px;padding:5px 14px;font-size:13.5px;font-weight:500;color:var(--muted)}
  .pager-tabs button[aria-selected="true"]{background:var(--card);color:var(--accent-ink);box-shadow:0 1px 3px rgba(30,60,90,.12)}
  .pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -22px;padding:0 22px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding:0 22px;align-items:stretch}
  .pager::-webkit-scrollbar{display:none}
  .pager > .pane{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always}
  .memo textarea{min-height:300px}
}
.side{display:grid;gap:12px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
@media (max-width:560px){
  /* 아이폰은 글씨가 16px보다 작은 입력칸을 누르면 화면을 확대해요 */
  input,select,textarea{font-size:16px!important}
  .wrap{padding:18px 22px 64px}
  .card{padding:18px}
  .hero{grid-template-columns:minmax(0,1fr) 104px;gap:12px;padding:16px}
  .jar > svg{width:100px}
  .clock-big{font-size:38px}
  .clock-big small{font-size:14px;margin:0 3px 0 2px}
  .tabs{margin-left:0}
  .task{grid-template-columns:auto 1fr}
  .t-acts{grid-column:2;margin:-4px 0 -4px -6px}
}

/* filters + add */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;display:flex;align-items:center;gap:6px}
.fchip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-ink);font-weight:500}
.fchip em{font-style:normal;color:var(--muted);font-size:12px}
.add{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;margin-bottom:10px}
.add input,.add select,.field input,.field select,.modal input[type=text]{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;min-width:0}
.add input:focus,.field input:focus,.modal input:focus,.field select:focus,.add select:focus{border-color:var(--accent);outline:none}
@media (max-width:560px){.add{grid-template-columns:1fr 1fr}.add input{grid-column:1/-1}.add .btn{grid-column:1/-1}}

/* tasks: 카테고리 색은 같은 하늘 계열 안에서 톤만 다르게 */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 8px;border-radius:12px;border-bottom:1px solid var(--line)}
.task > div{min-width:0}
.task:last-child{border-bottom-color:transparent}
.task.is-top{background:color-mix(in srgb,var(--accent) 8%,var(--card));border-bottom-color:transparent;margin-bottom:4px}
.task.now{background:color-mix(in srgb,var(--accent) 13%,var(--card));border-bottom-color:transparent;margin-bottom:4px}
.task.done .t-text{text-decoration:line-through;color:var(--muted)}
.task.moved,.task.dropped{opacity:.5}
.tk{width:32px;height:32px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;padding:0}
.tk .ring{width:20px;height:20px;border-radius:50%;border:2px solid var(--c);display:block}
.tk:hover .ring{background:color-mix(in srgb,var(--c) 18%,transparent)}
.t-text{font-size:15px;word-break:break-word}
.t-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;align-items:center}
.chip{font-size:12px;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pri{font-size:11.5px;padding:0 7px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.pri.p1{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.tag{font-size:12px;color:var(--muted)}
.topbadge{font-size:12px;font-weight:500;color:var(--accent-ink)}
.rank{font-size:11.5px;font-weight:700;padding:0 7px;border-radius:6px;line-height:1.6}
.rank.r1{background:var(--accent);color:#fff}
.rank.r2{background:color-mix(in srgb,var(--accent) 22%,var(--card));color:var(--accent-ink)}
.rank.r3{background:var(--accent-soft);color:var(--accent-ink)}
.rankpick{display:flex;gap:4px;align-items:center}
.rankpick button{min-width:30px;height:30px;border-radius:9px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--card);color:var(--accent-ink);font-weight:700;font-size:13px;padding:0 6px}
.rankpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.rankpick button.none{color:var(--muted);border-color:var(--line);font-weight:500;font-size:12px}
.task.picking .t-acts{opacity:1!important}
.t-acts{display:flex;gap:2px}
.ib{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib.on{color:var(--accent)}
.ib svg{width:17px;height:17px}
@media (hover:hover){.task .t-acts{opacity:0;transition:opacity .15s}.task:hover .t-acts,.task:focus-within .t-acts{opacity:1}}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
.section-label{font-size:12.5px;color:var(--muted);margin:14px 0 6px;font-weight:500}

/* mail slots */
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 4px;font-size:13.5px;font-weight:500;display:grid;justify-items:center;gap:1px;font-variant-numeric:tabular-nums}
.slot small{font-size:11px;color:var(--muted);font-weight:400}
.slot.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.slot.ok small{color:var(--accent-ink)}
.slot.late{background:var(--alert-bg);border-color:color-mix(in srgb,var(--alert) 40%,transparent);color:var(--alert)}
.slot.late small{color:var(--alert)}
.slot.miss{color:var(--muted)}
.alarm-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}

/* closing timeline */
.closing{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.closing li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;font-size:14.5px}
.closing .tm{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.closing .tm.mon{font-size:12px;font-weight:500}
.closing li.past{color:var(--muted)}
.closing li.past .tm{color:var(--muted)}
.closing li.now{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.closing .st{font-size:12px;color:var(--muted)}
.closing li.now .st{color:var(--accent-ink);font-weight:700}

/* plan */
.plan-nav{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.plan-nav .mid{flex:1;text-align:center}
.plan-nav .rel{color:var(--muted);font-size:13px}

/* week */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .v small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:3px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wchart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:190px;padding-top:6px}

<script type="text/plain" id="widget-src">// 뭉게뭉게 위젯 (아이폰 Scriptable 앱용)
// 앱 설정의 "위젯 코드 복사"로 복사하면 아래 두 줄이 이미 채워져 있어요.
// 직접 붙여넣었다면 구글 시트 웹 앱 URL과 비밀번호를 따옴표 안에 넣어주세요.
const SHEET_URL = "__URL__";
const SECRET = "__KEY__";
const APP_URL = "https://5082-8282.github.io/mungge/";

const C = {
  bgTop: Color.dynamic(new Color("#FBFDFF"), new Color("#1D3A57")),
  bgBottom: Color.dynamic(new Color("#E1F1FC"), new Color("#121A22")),
  ink: Color.dynamic(new Color("#1E2E3D"), new Color("#E6EEF5")),
  muted: Color.dynamic(new Color("#6B7E8F"), new Color("#93A6B7")),
  accent: Color.dynamic(new Color("#2A6FA8"), new Color("#8DC4F0")),
  alert: Color.dynamic(new Color("#E07A4F"), new Color("#F09068")),
  soft: Color.dynamic(new Color("#FFFFFF", 0.75), new Color("#FFFFFF", 0.08))
};
const CAT = { sky: "#5AAAE6", rose: "#3A6796", leaf: "#3E9DB0", tang: "#7F94DB", lilac: "#9DB4CC", sand: "#6F8699" };

const pad = n => String(n).padStart(2, "0");
const now = new Date();
const today = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
const nowM = now.getHours() * 60 + now.getMinutes();
const rk = t => t.rank || (t.top ? 1 : 0);
const mins = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + (m || 0); };
const at = t => { const d = new Date(now); d.setHours(Math.floor(mins(t) / 60), mins(t) % 60, 0, 0); return d; };

async function load() {
  const url = `${SHEET_URL}?key=${encodeURIComponent(SECRET)}&only=settings,d-${today}&t=${Date.now()}`;
  const req = new Request(url);
  req.timeoutInterval = 20;
  const j = await req.loadJSON();
  if (!j.ok) throw new Error(j.error === "key" ? "비밀번호가 달라요" : "불러오지 못했어요");
  return j.docs || {};
}

function summarize(docs) {
  const st = Object.assign({ start: "14:00", end: "17:50", mailEvery: 30, cats: [], close: [] }, docs.settings || {});
  const day = docs["d-" + today] || { tasks: [], checks: {} };
  const tasks = (day.tasks || []).filter(t => !t.moved && !t.dropped);
  const left = tasks.filter(t => !t.done)
    .sort((a, b) => (rk(a) || 9) - (rk(b) || 9) || (a.pri || 2) - (b.pri || 2) || (a.c || 0) - (b.c || 0));
  const checks = day.checks || {};
  const ok = t => { const c = checks[t]; return !!(c && (c.ok || (c.mail && c.appr))); };
  let clouds = 0;
  tasks.forEach(t => { if (t.done) clouds += t.top ? 2 : 1; });
  Object.keys(checks).forEach(t => { if (ok(t)) clouds += 1; });
  const step = Math.max(10, Number(st.mailEvery) || 30), slots = [];
  for (let m = mins(st.start); m < mins(st.end); m += step) slots.push(`${pad(Math.floor(m / 60))}:${pad(m % 60)}`);
  const late = slots.find(t => mins(t) <= nowM && nowM < mins(t) + step && !ok(t));
  const next = slots.find(t => mins(t) > nowM);
  const closeNext = (st.close || []).filter(c => c.time && mins(c.time) >= nowM)
    .sort((a, b) => mins(a.time) - mins(b.time))[0];
  const color = id => { const c = (st.cats || []).find(x => x.id === id); return new Color(CAT[(c && c.color) || "sand"] || CAT.sand); };
  const catName = id => { const c = (st.cats || []).find(x => x.id === id); return c && c.name ? String(c.name).replace(/ ?업무$/, "") : "기타"; };
  const focus = tasks.find(t => t.id === day.focus && !t.done);
  const topT = tasks.find(t => t.top);
  const closed = !!day.closedAt || !!(st.autoShutter && !day.reopened && nowM >= mins(st.autoShutter));
  return { st, closed, catName, top: topT && !topT.done ? topT : null, topDone: !!(topT && topT.done), left, done: tasks.length - left.length, total: tasks.length, clouds, late, next, closeNext, color, focus, wrapped: !!day.wrapped, slots };
}

/* ---------- 그리기 ---------- */
/* 둥근 글씨체가 없으면 기본 글씨체로 */
function mkFont(weight, size) {
  const names = weight === "bold" ? ["boldRoundedSystemFont", "boldSystemFont"]
    : weight === "semi" ? ["semiboldRoundedSystemFont", "semiboldSystemFont", "boldSystemFont"]
    : weight === "medium" ? ["mediumRoundedSystemFont", "mediumSystemFont", "regularRoundedSystemFont", "systemFont"]
    : ["regularRoundedSystemFont", "regularSystemFont", "systemFont"];
  for (const n of names) if (typeof Font[n] === "function") return Font[n](size);
  return Font.systemFont(size);
}
function txt(stack, s, size, color, weight, lines) {
  const t = stack.addText(String(s));
  t.font = mkFont(weight, size);
  t.textColor = color;
  t.lineLimit = lines || 1;
  t.minimumScaleFactor = 0.7;
  return t;
}
function icon(stack, name, size, color) {
  const sym = SFSymbol.named(name);
  sym.applyFont(Font.systemFont(size));
  const img = stack.addImage(sym.image);
  img.imageSize = new Size(size * 1.15, size);
  img.tintColor = color;
  return img;
}
/* 오늘 모은 구름이 쌓인 유리병 */
function jarImage(n) {
  const W = 120, H = 156, dc = new DrawContext();
  dc.size = new Size(W, H); dc.opaque = false; dc.respectScreenScale = true;
  const P = (x, y) => new Point(x, y);
  const body = () => { const p = new Path(); p.move(P(36, 30)); p.addLine(P(84, 30)); p.addLine(P(84, 38)); p.addQuadCurve(P(106, 68), P(106, 44)); p.addLine(P(106, 132)); p.addQuadCurve(P(90, 148), P(106, 148)); p.addLine(P(30, 148)); p.addQuadCurve(P(14, 132), P(14, 148)); p.addLine(P(14, 68)); p.addQuadCurve(P(36, 38), P(14, 44)); p.closeSubpath(); return p; };
  dc.addPath(body()); dc.setFillColor(new Color("#3D8FD1", 0.10)); dc.fillPath();
  const tints = ["#FFFFFF", "#E6F3FC", "#FFFFFF", "#CFE6F8", "#FFFFFF", "#E6F3FC"];
  const cloud = (x, y, sc, fill) => {
    dc.setFillColor(new Color(fill));
    [[7.5, 14.5, 3.6], [12, 11, 5], [16.8, 13.8, 4.2]].forEach(([cx, cy, r]) => dc.fillEllipse(new Rect(x + (cx - r) * sc, y + (cy - r) * sc, r * 2 * sc, r * 2 * sc)));
    dc.fillRect(new Rect(x + 7.5 * sc, y + 13 * sc, 9.3 * sc, 5.1 * sc));
  };
  const shown = Math.min(n, 21);

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },

const store = {
  kind:'wait', col:null, cfg:null, pollTimer:null, onData:null, onErr:null,
  async init(){
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if(db && user){ const id = await user.id(); if(id){ this.col = db.collection('data/users/'+id); this.kind = 'cloud'; return; } }
      }
    }catch(e){}
    const cfg = LS.get('mung-sheet', null);
    if(cfg && cfg.url){ this.cfg = cfg; this.kind = 'sheet'; return; }
    this.kind = LS.get('mung-localonly', false) ? 'local' : 'setup';
  },
  readLocal(){ return LS.get('dotori-v1', {}); },
  /* Apps Script 웹 앱 호출 */
  async sheetGet(cfg){
    const c = cfg || this.cfg;
    const r = await fetch(c.url+(c.url.includes('?')?'&':'?')+'key='+encodeURIComponent(c.key)+'&t='+Date.now(), {redirect:'follow'});
    const j = await r.json();
    if(!j.ok) throw {code: j.error==='key' ? 'key' : 'unavailable'};
    return j.docs || {};
  },
  async sheetSet(id, data){
    const r = await fetch(this.cfg.url, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({key:this.cfg.key, id, data})});
    const j = await r.json();
    if(!j.ok) throw {code: j.error==='key' ? 'key' : 'unavailable'};
  },
  async pull(){
    try{
      const remote = await this.sheetGet();
      const cache = this.readLocal(), unsynced = LS.get('mung-unsynced', {});
      Object.keys(unsynced).forEach(id => { if(cache[id]) { remote[id] = cache[id]; save(id, cache[id]); } });
      LS.set('dotori-v1', remote);
      this.onData(remote, {fromCache:false});
      setSync('ok','구글 시트에 저장됨');
    }catch(e){
      setSync('err', e && e.code==='key' ? '비밀번호가 달라요' : '연결 안 됨 · 이 기기에 임시 저장');
      if(!S.loaded) this.onData(this.readLocal(), {fromCache:true});
    }
  },
  subscribe(onData, onErr){
    this.onData = onData; this.onErr = onErr;
    if(this.kind==='cloud'){
      this.col.onSnapshot(snap => { const out = {}; snap.docs.forEach(d => { if(d.exists) out[d.id] = d.data(); }); onData(out, snap.metadata); }, onErr);
    } else if(this.kind==='sheet'){
      const cache = this.readLocal();
      if(Object.keys(cache).length) onData(cache, {fromCache:true});
      setSync('wait','구글 시트 불러오는 중');
      this.pull();
      clearInterval(this.pollTimer);
      this.pollTimer = setInterval(() => { if(document.visibilityState==='visible') this.pull(); }, 30000);
    } else onData(this.readLocal(), {fromCache:false});
  },
  async set(id, data){
    if(this.kind==='cloud') return this.col.doc(id).set(data);
    const all = this.readLocal(); all[id] = data; LS.set('dotori-v1', all);
    if(this.kind==='sheet'){
      const u = LS.get('mung-unsynced', {}); u[id] = 1; LS.set('mung-unsynced', u);
      await this.sheetSet(id, data);
      const u2 = LS.get('mung-unsynced', {}); delete u2[id]; LS.set('mung-unsynced', u2);
      setSync('ok','구글 시트에 저장됨');
    }
  }
};
const pending = {}, timers = {}, inflight = {};
function save(id, data){ pending[id] = clone(data); clearTimeout(timers[id]); timers[id] = setTimeout(() => flush(id), 450); }
async function flush(id){
  if(inflight[id]){ clearTimeout(timers[id]); timers[id] = setTimeout(() => flush(id), 250); return; }
  const data = pending[id]; if(!data) return;
  delete pending[id]; inflight[id] = true;
  try{ await store.set(id, data); }
  catch(e){
    if(store.kind==='sheet'){
      /* 이 기기엔 저장돼 있고, 연결되면 다시 보내요 */
      if(!(id in pending)){ pending[id] = data; clearTimeout(timers[id]); timers[id] = setTimeout(() => flush(id), 15000); }
      setSync('err', e && e.code==='key' ? '비밀번호가 달라요' : '연결 안 됨 · 이 기기에 임시 저장');
    } else if(e && e.code==='unavailable'){ await new Promise(r => setTimeout(r, 700+Math.random()*800)); try{ await store.set(id, data); }catch(e2){ writeFailed(e2); } }
    else writeFailed(e);
  } finally { inflight[id] = false; }
}
function flushAll(){ Object.keys(pending).forEach(id => { clearTimeout(timers[id]); flush(id); }); }
function writeFailed(e){
  if(e && e.code==='quota_exceeded') toast('저장 공간이 가득 찼어요. 오래된 기록을 정리해야 해요', true);
  else toast('저장이 안 됐어요. 인터넷 연결을 확인해 주세요', true);

}

const alarm = {
  ctx:null,
  wanted(){ try{ return localStorage.getItem('dotori-alarm')==='on'; }catch(e){ return !!this._on; } },
  setWanted(v){ this._on = v; try{ localStorage.setItem('dotori-alarm', v?'on':'off'); }catch(e){} },
  unlock(){ try{ if(!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) this.ctx = new AC(); } if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); }catch(e){} },
  chime(){
    try{ const c = this.ctx; if(!c || c.state!=='running') return;
      [[880,0],[1175,.16],[1568,.32]].forEach(([f,t]) => { const o = c.createOscillator(), g = c.createGain(); o.type='sine'; o.frequency.value=f;
        g.gain.setValueAtTime(0.0001, c.currentTime+t); g.gain.exponentialRampToValueAtTime(0.18, c.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t+0.5);
        o.connect(g).connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+0.55); });
    }catch(e){}
  },
  notifyState(){ try{ return ('Notification' in window) ? Notification.permission : 'none'; }catch(e){ return 'none'; } },
  async ask(){ try{ if('Notification' in window && Notification.permission==='default') await Notification.requestPermission(); }catch(e){} },
  fire(title, body){
    if(!this.wanted()) return;
    this.chime();
    try{ if(this.notifyState()==='granted'){ const opt = {body, tag:'mung-'+title, icon:'icons/icon-192.png', badge:'icons/icon-192.png'};
      if(this.reg && this.reg.showNotification) this.reg.showNotification(title, opt); else new Notification(title, opt); } }catch(e){}
  },
  firedKey:'dotori-fired',
  wasFired(k){ try{ const o = JSON.parse(localStorage.getItem(this.firedKey)||'{}'); return !!o[k]; }catch(e){ return !!(this._f && this._f[k]); } },
  markFired(k){ try{ const o = JSON.parse(localStorage.getItem(this.firedKey)||'{}'); Object.keys(o).forEach(x => { if(!x.startsWith(todayKey())) delete o[x]; }); o[k] = 1; localStorage.setItem(this.firedKey, JSON.stringify(o)); }catch(e){ this._f = this._f||{}; this._f[k] = 1; } }
};

function phase(){ const st = ST(), n = nowMins(); return n < minsOf(st.start) ? 'before' : (n < minsOf(st.end) ? 'during' : 'after'); }
function slotState(day, t){
  if(slotOk(day,t)) return 'ok';
  const slots = mailSlots(), i = slots.indexOf(t), n = nowMins(), m = minsOf(t);
  if(n < m) return 'wait';
  const nextM = i>=0 && i < slots.length-1 ? minsOf(slots[i+1]) : minsOf(ST().end);
  return n < nextM ? 'late' : 'miss';
}
function overdueSlot(day){
  if(day.wrapped) return null;

function closeState(k){
  const items = closingToday(k), n = nowMins();
  const timed = items.filter(c => c.time).map(c => minsOf(c.time)).sort((a,b) => a-b);
  let nowIdx = -1;
  items.forEach((c,i) => {
    if(!c.time) return;
    const m = minsOf(c.time); const nxt = timed.find(x => x > m);
    if(n >= m && (nxt==null ? n < m+10 : n < nxt)) nowIdx = i;
  });
  return items.map((c,i) => {
    let s = 'wait';
    if(c.time){ if(i===nowIdx) s = 'now'; else if(n >= minsOf(c.time)) s = 'past'; }

function weekData(ws){
  const days = [], slotsN = mailSlots().length;
  for(let i=0;i<7;i++){ const k = addDays(ws,i); days.push({k, day:getDay(k), has:!!S.days[k]}); }
  const catCount = {}; let acorns=0, done=0, topDone=0, chk=0, chkTotal=0, arrive=0, moved=0, dropped=0, best=null;
  days.forEach(x => {
    const d = x.day, a = acornsOf(d); x.a = a; acorns += a;
    const lt = d.tasks.filter(live); x.total = lt.length; x.done = lt.filter(t => t.done).length;
    d.tasks.forEach(t => { if(t.done){ done++; if(t.top) topDone++; catCount[t.cat]=(catCount[t.cat]||0)+1; } if(t.moved) moved++; if(t.dropped) dropped++; });
    x.active = x.has && (d.tasks.length || Object.keys(d.arrive).length || Object.keys(d.checks).length);
    if(x.active){ chkTotal += slotsN; chk += Object.keys(d.checks).filter(t => slotOk(d,t)).length; }
    if(arriveDone(d)) arrive++;
    if(!best || a > best.a) best = x;
  });
  return {days, catCount, acorns, done, topDone, chk, chkTotal, arrive, moved, dropped, best};
}

  if(cats.length) lines.push('· 카테고리별: '+cats.map(c => catOf(c[0]).name+' '+c[1]+'개').join(', '));

  if(w.moved || w.dropped) lines.push('· 다음 날로 넘긴 일 '+w.moved+'개, 보내준 일 '+w.dropped+'개');
  if(w.best && w.best.a) lines.push('· 제일 부지런한 날: '+fmtDate(w.best.k)+' 구름 '+w.best.a+'개');
  const memos = w.days.filter(x => x.day.memo);
  if(memos.length){ lines.push('', '한 줄 기록'); memos.forEach(x => lines.push('  '+shortDate(x.k)+' '+x.day.memo)); }

function render(force){
  if(!S.loaded) return;
  const ae = document.activeElement;
  const typing = ae && ((ae.tagName==='INPUT' && (ae.type==='text' || ae.type==='time' || ae.type==='date')) || ae.tagName==='TEXTAREA');
  if(typing && !force){ S.deferred = true; return; }
  const fid = ae && ae.id, sel = typing && ae.type==='text' ? [ae.selectionStart, ae.selectionEnd] : null;
  let body;
  if(S.view==='setup'){ document.getElementById('app').innerHTML = renderSetup(); updateTitle(); S.deferred = false; return; }
  if(S.view==='plan') body = renderPlan();
  else if(S.view==='week') body = renderWeek();
  else if(S.view==='settings') body = renderSettings();
  else body = renderToday();
  document.getElementById('app').innerHTML = headerHTML()+body+wrapModalHTML();
  if(fid){ const el = document.getElementById(fid); if(el){ el.focus({preventScroll:true}); if(sel && el.setSelectionRange){ try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} } } }
  updateTitle(); S.deferred = false;
  const pg = document.getElementById('pager');
  if(pg){
    const step = () => { const ps = pg.querySelectorAll('.pane'); return ps.length > 1 ? Math.max(1, ps[1].offsetLeft - ps[0].offsetLeft) : 1; };
    if(S.pagerIndex) pg.scrollLeft = step() * S.pagerIndex;
    pg.addEventListener('scroll', () => {
      const i = Math.round(pg.scrollLeft / step());
      if(i !== (S.pagerIndex||0)){ S.pagerIndex = i; document.querySelectorAll('.pager-tabs button').forEach((b,j) => b.setAttribute('aria-selected', String(j===i))); }
    }, {passive:true});
  }
}

      if(t.done){ gained = t.top ? 2 : 1; if(day.focus===t.id) day.focus = null; } });
    if(gained) toast(wasTop ? '1순위 해치움! 구름 2개' : CHEERS[Math.floor(Math.random()*CHEERS.length)]);

      const t = findTask(day, el.dataset.id); if(!t) return;
      const before = rankOf(t);
      const others = day.tasks.filter(x => x!==t && live(x) && !x.done && rankOf(x));
      const setR = (x, v) => { if(v>=1 && v<=3) x.rank = v; else delete x.rank; x.top = v===1; };
      if(r && before){ /* 순위가 있던 일끼리는 자리를 바꿔요 */
        others.forEach(x => { if(rankOf(x)===r) setR(x, before); });
      } else if(r){ /* 새로 끼워 넣으면 그 아래 순위가 하나씩 밀려요 */
        others.filter(x => rankOf(x)>=r).forEach(x => setR(x, rankOf(x)+1));
      } else if(before){ /* 순위를 빼면 아래 순위가 하나씩 올라와요 */
        others.filter(x => rankOf(x)>before).forEach(x => setR(x, rankOf(x)-1));

function sortClose(s){
  /* 시간이 없는 일(월요일 퇴근 문자 등)은 바로 앞 일 뒤에 그대로 붙어 있어요 */
  let last = '00:00';
  const keyed = s.close.map((c,i) => { const k = c.time ? c.time : last+'~'; if(c.time) last = c.time; return {c, k, i}; });
  keyed.sort((x,y) => x.k < y.k ? -1 : x.k > y.k ? 1 : x.i - y.i);
  s.close = keyed.map(x => x.c);
}

      .replace('"https://5082-8282.github.io/mungge/"', JSON.stringify(app));
    const box = document.getElementById('widget-out');
    const show = () => { if(box){ box.style.display = 'block'; box.value = code; box.focus(); box.select(); } toast('아래 코드를 길게 눌러 복사해 주세요'); };
    try{ navigator.clipboard.writeText(code).then(() => toast('위젯 코드를 복사했어요. Scriptable에 붙여넣어요'), show); }catch(e){ show(); }
  }
});
async function boot(){
  try{ if('serviceWorker' in navigator && location.protocol==='https:' && !window.claude){ navigator.serviceWorker.register('sw.js').then(r => { alarm.reg = r; }).catch(() => {}); } }catch(e){}
  const slow = setTimeout(() => { const t = document.querySelector('#splash .tagline'); if(t && !S.loaded) t.textContent = '연결이 조금 늦어요. 잠깐만 기다려 주세요…'; }, 10000);
  await store.init();
  clearTimeout(slow);
  if(store.kind==='setup'){ S.settings = clone(DEFAULT_SETTINGS); S.loaded = true; route(); hideSplash(); }
  else startStore();
  setInterval(tick, 15000);
}
boot();
})();
</script>
